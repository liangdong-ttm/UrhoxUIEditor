<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urhox UI Editor</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="editor">
    <header class="chrome">
      <div class="menubar">
        <div class="menubar-left">
          <strong class="app-title">Urhox UI Editor</strong>
          <button id="openProjectBtn" type="button">打开项目</button>
          <button id="saveBtn" type="button" class="ghost" disabled>保存</button>
          <input id="folderInput" type="file" webkitdirectory multiple hidden />
          <span id="projectName" class="muted truncate">未打开项目 · 内置示例</span>
          <span id="permBadge" class="perm-badge">检查权限…</span>
          <span id="dirtyBadge" class="dirty-badge hidden">未保存</span>
        </div>
        <div class="menubar-right">
          <label class="device-label">屏幕
            <select id="deviceSelect">
              <option value="720p">720p 720×1280</option>
              <option value="1080p" selected>1080p 1080×1920</option>
              <option value="2k">2K 1440×2560</option>
              <option value="4k">4K 2160×3840</option>
              <option value="1080p-land">1080p 横屏 1920×1080</option>
              <option value="2k-land">2K 横屏 2560×1440</option>
            </select>
          </label>
          <span id="scaleBadge" class="muted">1.00×</span>
          <span class="sep"></span>
          <span id="zoomLabel" class="muted">100%</span>
          <button id="fitBtn" type="button" class="ghost">适应</button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="hierarchy">
        <div class="panel-title">UI节点树</div>
        <div id="tree" class="tree"></div>
      </aside>
      <div class="split-v" data-split="left" title="拖动调整宽度"></div>

      <section class="canvas-pane">
        <div class="canvas-toolbar">
          <div class="tool-group" title="选择">
            <button type="button" class="icon-btn" id="pickToolBtn" title="选择工具：点击空白后可在画面上点选节点">选择</button>
          </div>
          <div class="tool-group" title="对齐">
            <button type="button" class="icon-btn" data-align="left" title="左对齐">⇤</button>
            <button type="button" class="icon-btn" data-align="hcenter" title="水平居中">↔</button>
            <button type="button" class="icon-btn" data-align="right" title="右对齐">⇥</button>
            <button type="button" class="icon-btn" data-align="top" title="顶对齐">⤒</button>
            <button type="button" class="icon-btn" data-align="vcenter" title="垂直居中">↕</button>
            <button type="button" class="icon-btn" data-align="bottom" title="底对齐">⤓</button>
          </div>
          <div class="tool-group" title="分布">
            <button type="button" class="icon-btn" data-dist="x" title="水平均分">||</button>
            <button type="button" class="icon-btn" data-dist="y" title="垂直均分">=</button>
          </div>
          <div class="tool-group" title="编组">
            <button type="button" class="icon-btn" id="groupBtn" title="编组 ⌘G">▢+</button>
            <button type="button" class="icon-btn" id="ungroupBtn" title="解组 ⇧⌘G">▢−</button>
          </div>
          <span id="meta" class="muted truncate meta-path"></span>
        </div>
        <main class="preview" id="preview">
          <div class="preview-stage" id="previewStage">
            <div class="artboard-label" id="artboardLabel">Frame</div>
            <canvas id="stage" width="720" height="1280"></canvas>
          </div>
        </main>
      </section>

      <div class="split-v" data-split="right" title="拖动调整宽度"></div>
      <aside class="inspector">
        <div class="panel-title">控件属性</div>
        <div id="inspector" class="inspector-body">
          <p class="muted">选中一个节点后显示属性</p>
        </div>
      </aside>
    </div>

    <div class="split-h" data-split="bottom" title="拖动调整高度"></div>

    <footer class="project-bar">
      <div class="bottom-tabs">
        <button type="button" class="tab-btn active" data-tab="project">项目</button>
        <button type="button" class="tab-btn" data-tab="ui">UI配置</button>
      </div>
      <div class="bottom-body">
        <div class="project-dirs">
          <div class="panel-title" id="bottomDirTitle">项目目录</div>
          <div id="projectDirs" class="project-dir-tree"></div>
        </div>
        <div class="split-v" data-split="project" title="拖动调整宽度"></div>
        <div class="project-files-pane">
          <div class="panel-title project-files-title">
            <span id="bottomListTitle">文件</span>
            <div class="view-toggle">
              <button id="viewListBtn" type="button" class="ghost active">列表</button>
              <button id="viewIconBtn" type="button" class="ghost">图标</button>
            </div>
          </div>
          <div id="projectFiles" class="project-files"></div>
        </div>
      </div>
    </footer>
  </div>

  <div id="missingUiDialog" class="dialog-mask hidden">
    <div class="dialog">
      <h3>这个项目还没有 UI 配置</h3>
      <p class="muted">编辑器只加载 <code>assets/ui/*.ui.json</code>。界面如果还写在 Lua 里，需要先抽成配置文件。</p>
      <ol class="guide-list">
        <li>在项目里让 AI 使用 skill <code>lua-ui-to-json</code></li>
        <li>对「抽 UI / 转 ui.json / UI 数据化」发出请求</li>
        <li>抽完后重新打开本项目</li>
      </ol>
      <div class="dialog-actions">
        <button id="missingUiOk" type="button">知道了</button>
      </div>
    </div>
  </div>

  <div id="saveDialog" class="dialog-mask hidden">
    <div class="dialog">
      <h3>要保存对当前 UI 的修改吗？</h3>
      <p id="saveDialogPath" class="muted"></p>
      <div class="dialog-actions">
        <button id="saveDialogCancel" type="button" class="ghost">取消</button>
        <button id="saveDialogDiscard" type="button" class="ghost danger">不保存</button>
        <button id="saveDialogSave" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="src/config.js"></script>
  <script src="src/yoga-lite.js"></script>
  <script src="src/geom.js"></script>
  <script src="src/history.js"></script>
  <script src="src/doc.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/tree.js"></script>
  <script src="src/inspector.js"></script>
  <script src="src/canvas.js"></script>
  <script src="src/commands.js"></script>
  <script src="src/layout.js"></script>
  <script src="src/input.js"></script>
  <script src="src/preview.js"></script>
  <script src="src/save.js"></script>
  <script src="src/hotkeys.js"></script>
  <script src="src/editor.js"></script>
</body>
</html>
